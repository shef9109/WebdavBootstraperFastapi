{% extends "base.html" %}

{% block title %}Upload File - WebDAV Cloud{% endblock %}

{% block content %}
    <h2>Upload File</h2>
    <form id="upload-form" enctype="multipart/form-data">
        <label for="file">Choose file:</label>
        <input type="file" id="file" name="file" required>
        <button type="submit">Upload</button>
    </form>

    <div id="message"></div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById("upload-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        const fileInput = document.getElementById("file");
        const filenameInput = document.getElementById("filename");
        const file = fileInput.files[0];
        const filename = filenameInput.value.trim() || file.name;
        const messageDiv = document.getElementById("message");

        if (!file) {
            messageDiv.style.color = "red";
            messageDiv.innerHTML = "<p>Please select a file to upload.</p>";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("filename", filename);

        const response = await fetch(`/webdav/index?path=${encodeURIComponent(filename)}`, {
            method: "PUT",
            body: formData,
            credentials: 'include',

        });

        let data;
        try {
            data = await response.json();
        } catch (e) {
            data = { detail: "Непредвиденная ошибка" };
        }

        if (response.status === 200 || response.status === 201) {
            messageDiv.style.color = "green";
            messageDiv.innerHTML = `<p>${data.info}</p>`;
            fileInput.value = "";
        } else {
            messageDiv.style.color = "red";
            messageDiv.innerHTML = `<p>Error: ${data.detail}</p>`;
        }
    });
</script>
{% endblock %}
